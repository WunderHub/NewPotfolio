<!doctype html>
<html lang="pt-BR" data-composition-variables='[{"id":"name1","type":"string","label":"Nome","default":"KAUÊ"},{"id":"name2","type":"string","label":"Sobrenome","default":"RIBEIRO"}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root { --ground: #070b1a; --ink: #dde6ff; --deep: #3047ff; --font-display: "League Gothic"; --font-body: "Inter"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ground); font-family: var(--font-display); color: var(--ink); }
      .line { position: absolute; left: 150px; font-size: 420px; line-height: 0.82; letter-spacing: -0.01em; white-space: nowrap; }
      #n1 { top: 110px; } #n2 { top: 470px; }
      .mask { position: absolute; left: 0; right: 0; overflow: hidden; }
      #m1 { top: 30px; height: 440px; } #m2 { top: 400px; height: 430px; }
      #m1 .line { top: 80px; } #m2 .line { top: 70px; }
      .word { position: absolute; right: 150px; bottom: 150px; font-family: var(--font-body); font-weight: 700; font-size: 64px; letter-spacing: -0.02em; color: var(--ink); }
      #rule { position: absolute; left: 150px; right: 150px; bottom: 120px; height: 6px; background: var(--ink); transform-origin: left center; }
      #tag { position: absolute; left: 150px; bottom: 150px; font-family: var(--font-body); font-weight: 400; font-size: 44px; color: var(--ink); }
      #wipe { position: absolute; inset: 0; background: var(--deep); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="m1" class="mask clip" data-start="0" data-duration="8" data-track-index="0"><div id="n1" class="line" data-var-text="name1">KAUÊ</div></div>
      <div id="m2" class="mask clip" data-start="0" data-duration="8" data-track-index="1"><div id="n2" class="line" data-var-text="name2">RIBEIRO</div></div>
      <div id="rule-host" class="clip" data-start="0" data-duration="8" data-track-index="2"><div id="rule"></div></div>
      <div id="w1-host" class="clip" data-start="1.6" data-duration="1.4" data-track-index="3"><div id="w1" class="word">Sites</div></div>
      <div id="w2-host" class="clip" data-start="3.0" data-duration="1.4" data-track-index="3"><div id="w2" class="word">Landing pages</div></div>
      <div id="w3-host" class="clip" data-start="4.4" data-duration="1.6" data-track-index="3"><div id="w3" class="word">Interfaces</div></div>
      <div id="tag-host" class="clip" data-start="1.4" data-duration="6.6" data-track-index="4"><div id="tag">Portfólio · 2026</div></div>
      <div id="wipe-host" class="clip" data-start="7.2" data-duration="0.8" data-track-index="5"><div id="wipe"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#n1", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.15);
      tl.fromTo("#n2", { yPercent: 100 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.35);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power3.inOut" }, 0.9);
      tl.fromTo("#tag", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.45);
      [["#w1",1.6,3.0],["#w2",3.0,4.4],["#w3",4.4,6.0]].forEach(([id,s,e]) => {
        tl.fromTo(id, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, s);
        tl.to(id, { opacity: 0, y: -40, duration: 0.25, ease: "power2.in" }, e - 0.3);
      });
      tl.fromTo("#n1", { x: 0 }, { x: -40, duration: 6, ease: "none" }, 1.0);
      tl.fromTo("#n2", { x: 0 }, { x: 40, duration: 6, ease: "none" }, 1.0);
      tl.fromTo("#wipe", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power4.inOut" }, 7.2);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
